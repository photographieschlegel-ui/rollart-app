<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Admin</title>

<style>
body{font-family:Arial;background:#0f172a;color:white;margin:0;padding:10px;}
.card{background:#1e293b;padding:10px;margin-bottom:10px;border-radius:10px;}
button{padding:10px;margin-top:5px;width:100%;}
input{width:100%;padding:10px;margin-top:5px;}
.result{background:#334155;padding:5px;margin:5px;border-radius:8px;}
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
 apiKey:"AIzaSy...",
 authDomain:"rollart-score-5319a.firebaseapp.com",
 projectId:"rollart-score-5319a"
});

const db=getFirestore(app);

let competitions=[];
let active=null;

// ✅ komplette abzüge
const deductions={
 "1":0.3,"2":0.5,"3":0.3,"4":0.2,"5":0.3,"6":0.3,"7":0.3,"8":0.3,
 "9":0.5,"10":0.5,"11":0.3,"12":0.3,"13":0.3,"14":0.3,"15":0.3,
 "16":0.5,"17":0.2,"18":0.5,"19":0.5,"20":0.5,"21":0.3,"22":0.5,"23":0.2
};

async function save(){
 await setDoc(doc(db,"rollart","database"),{competitions});
 updateLive();
}

async function updateLive(){
 if(!active)return;
 const runner=active.runners.find(r=>r.live);
 await setDoc(doc(db,"rollart","live"),{
  competition:active,
  runner:runner||null
 });
}

// ✅ laden
async function load(){
 const snap=await getDoc(doc(db,"rollart","database"));
 if(snap.exists()) competitions=snap.data().competitions||[];
 renderComps();
}

window.onload=load;

// ✅ Wettbewerb erstellen
window.addComp=function(){
 competitions.push({
  id:Date.now(),
  name:compName.value,
  runners:[],
  finished:false
 });
 save(); renderComps();
};

// ✅ anzeigen
function renderComps(){
 let out="";
 competitions.forEach(c=>{
  out+=`<div class="result">
  ${c.name}
  <button onclick="openComp(${c.id})">Öffnen</button>
  </div>`;
 });
 compList.innerHTML=out;
}

// ✅ öffnen
window.openComp=function(id){
 active=competitions.find(c=>c.id===id);
 renderRunners();
};

// ✅ Läufer hinzufügen
window.addRunner=function(){
 active.runners.push({
  name:runnerName.value,
  a1:0,a2:0,a3:0,
  b1:0,b2:0,b3:0,
  total:0,
  deduction:0,
  place:0,
  live:false
 });
 save(); renderRunners();
};

// ✅ Start
window.startComp=function(){
 active.runners.forEach(r=>r.live=false);
 active.runners[0].live=true;
 save(); renderRunners();
};

// ✅ nächster
window.next=function(){
 const i=active.runners.findIndex(r=>r.live);
 if(i>=0){
  active.runners[i].live=false;
  if(active.runners[i+1]){
   active.runners[i+1].live=true;
  }
 }
 save(); renderRunners();
};

// ✅ Abzug berechnung
function calcDed(input){
 let sum=0;
 input.split(",").forEach(n=>{
  let num=n.trim().toUpperCase().replace("A","").replace("B","");
  if(deductions[num]) sum+=deductions[num];
 });
 return sum;
}

// ✅ speichern
window.saveScore=function(){

 const r=active.runners.find(x=>x.live);
 if(!r)return;

 r.a1=A1.value||0;
 r.a2=A2.value||0;
 r.a3=A3.value||0;

 r.b1=B1.value||0;
 r.b2=B2.value||0;
 r.b3=B3.value||0;

 r.aScore=+r.a1+ +r.a2+ +r.a3;
 r.bScore=+r.b1+ +r.b2+ +r.b3;

 r.deductionNumbers=ded.value;
 r.deduction=calcDed(ded.value);

 r.total=r.aScore+r.bScore-r.deduction;

 ranking();

 next();
};

// ✅ ranking
function ranking(){
 active.runners.sort((a,b)=>b.total-a.total);
 active.runners.forEach((r,i)=>r.place=i+1);
}

// ✅ anzeigen
function renderRunners(){
 if(!active)return;

 let out="";
 active.runners.forEach(r=>{
  out+=`<div class="result">
  ${r.place||""} ${r.name} (${r.total})
  ${r.live?"🔴":""}
  </div>`;
 });
 runnerList.innerHTML=out;
}

</script>
</head>

<body>

<div class="card">
<h3>Wettbewerb erstellen</h3>
<input id="compName" placeholder="Name">
<button onclick="addComp()">Speichern</button>
</div>

<div class="card">
<h3>Wettbewerbe</h3>
<div id="compList"></div>
</div>

<div class="card">
<h3>Läufer</h3>
<input id="runnerName" placeholder="Name">
<button onclick="addRunner()">Hinzufügen</button>
<div id="runnerList"></div>
</div>

<div class="card">
<h3>Live</h3>

<button onclick="startComp()">Start</button>

<br>
A:
<input id="A1"><input id="A2"><input id="A3">

<br>
B:
<input id="B1"><input id="B2"><input id="B3">

<br>
Abzüge:
<input id="ded" placeholder="z.B. 5,12,3">

<button onclick="saveScore()">Speichern</button>
<button onclick="next()">Weiter</button>
</div>

</body>
</html>
