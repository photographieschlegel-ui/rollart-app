<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>RollArt Wettbewerb</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
}

.container{
  display:grid;
  grid-template-columns: 350px 1fr;
  gap:10px;
  padding:10px;
}

.card{
  background:#1e293b;
  padding:12px;
  border-radius:12px;
}

input,textarea,button{
  width:100%;
  padding:10px;
  margin-top:5px;
  border:none;
  border-radius:8px;
}

button{background:#2563eb;color:white;}

.runner{
  background:#334155;
  padding:8px;
  margin:5px;
  border-radius:8px;
}

.live{background:#16a34a;}
.place1{background:#ca8a04;}
.place2{background:#9ca3af;}
.place3{background:#b45309;}

.big{
  font-size:28px;
}
</style>

<script>
let runners=[];
let currentIndex=0;

const ded={
 "1":0.3,"2":0.5,"3":0.3,"4":0.2,"5":0.3,"6":0.3,"7":0.3,"8":0.3,
 "9":0.5,"10":0.5,"11":0.3,"12":0.3,"13":0.3,"14":0.3,"15":0.3,
 "16":0.5,"17":0.2,"18":0.5,"19":0.5,"20":0.5,"21":0.3,"22":0.5,"23":0.2
};

// 📄 IMPORT
function importText(){

 let lines=importArea.value.split("\n");
 let category="";
 let start=1;

 lines.forEach(l=>{
  l=l.trim();
  if(!l) return;

  if(l.match(/^\d{2}:\d{2}/)){
    category = l.split(" ").slice(5).join(" ");
    return;
  }

  let m=l.match(/^(\d+)\s+(.+)$/);
  if(m){
    let parts=m[2].split(" ");

    let club=parts.slice(-2).join(" ");
    let name=parts.slice(0,-2).join(" ");

    runners.push({
      name,
      club,
      category,
      start:start++,
      total:0,
      place:0
    });
  }
 });

 render();
}

// ▶ START
function startRun(){
 currentIndex=0;
 highlight();
}

// ➡ WEITER
function next(){
 currentIndex++;
 highlight();
}

// ⭐ SPEICHERN
function saveScore(){

 let r=runners[currentIndex];

 let A=[A1.value,A2.value,A3.value].map(x=>+x||0);
 let B=[B1.value,B2.value,B3.value].map(x=>+x||0);

 let a=A.reduce((a,b)=>a+b,0);
 let b=B.reduce((a,b)=>a+b,0);

 let d=calcDed(dedInput.value);

 r.total=a+b-d;

 ranking();

 next();
}

// Abzüge
function calcDed(input){
 let sum=0;
 input.split(",").forEach(n=>{
   let num=n.trim().toUpperCase().replace("A","").replace("B","");
   if(ded[num]) sum+=ded[num];
 });
 return sum;
}

// Ranking
function ranking(){
 runners.sort((a,b)=>b.total-a.total);
 runners.forEach((r,i)=>r.place=i+1);
}

// Anzeige
function render(){

 let cats={};

 runners.forEach(r=>{
  if(!cats[r.category]) cats[r.category]=[];
  cats[r.category].push(r);
 });

 list.innerHTML=Object.keys(cats).map(cat=>`
  <div class="card">
    <b>${cat}</b>
    ${cats[cat].map(r=>`
      <div class="runner
      ${r.place==1?"place1":""}
      ${r.place==2?"place2":""}
      ${r.place==3?"place3":""}">
      ${r.place||r.start} ${r.name} (${r.club})<br>
      🏆 ${r.total||0}
      </div>
    `).join("")}
  </div>
 `).join("");
}

// aktueller Läufer
function highlight(){

 render();

 let current=runners[currentIndex];

 if(!current){
  currentRunner.innerHTML="FERTIG";
  return;
 }

 currentRunner.innerHTML=`
   🔴 <span class="big">${current.name}</span><br>
   ${current.club}
 `;
}
</script>
</head>

<body>

<div class="container">

<div>

<div class="card">
<h3>Startliste importieren (PDF Text)</h3>
<textarea id="importArea"></textarea>
<button onclick="importText()">Import</button>
</div>

<div class="card">
<h3>Wertung</h3>

<button onclick="startRun()">Start</button>

A:
<input id="A1"><input id="A2"><input id="A3">

B:
<input id="B1"><input id="B2"><input id="B3">

Abzüge:
<input id="dedInput" placeholder="z.B. 5,12,3">

<button onclick="saveScore()">Speichern</button>
<button onclick="next()">Weiter</button>

</div>

</div>

<div>

<div class="card" id="currentRunner">
Kein Lauf gestartet
</div>

<div id="list"></div>

</div>

</div>

</body>
</html>
