<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>RollArt Admin</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
}

.app{
  max-width:1400px;
  margin:auto;
  padding:15px;
}

.card{
  background:#1e293b;
  padding:15px;
  border-radius:16px;
  margin-bottom:12px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:10px;
}

.runner{
  background:#334155;
  padding:10px;
  border-radius:10px;
}

.live{background:#16a34a;}
.place1{background:#ca8a04;}
.place2{background:#9ca3af;}
.place3{background:#b45309;}

input,textarea,button{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:none;
  margin-top:6px;
}

button{
  background:#2563eb;
  color:white;
  font-weight:bold;
  cursor:pointer;
}
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
 apiKey:"AIzaSyDtwZxklHFyqzEkhGbpBHKjcgLmPcD-oAU",
 authDomain:"rollart-score-5319a.firebaseapp.com",
 projectId:"rollart-score-5319a"
});

const db=getFirestore(app);

let competitions=[];
let active=null;

// ✅ Abzüge komplett
const ded={
 "1":0.3,"2":0.5,"3":0.3,"4":0.2,"5":0.3,"6":0.3,"7":0.3,"8":0.3,
 "9":0.5,"10":0.5,"11":0.3,"12":0.3,"13":0.3,"14":0.3,"15":0.3,
 "16":0.5,"17":0.2,"18":0.5,"19":0.5,"20":0.5,"21":0.3,"22":0.5,"23":0.2
};

// speichern
async function save(){
 await setDoc(doc(db,"rollart","database"),{competitions});
 updateLive();
}

// LIVE
async function updateLive(){
 if(!active)return;
 const r=active.runners.find(x=>x.live);
 await setDoc(doc(db,"rollart","live"),{
  competition:active,
  runner:r||null
 });
}

// LOAD
async function load(){
 const snap=await getDoc(doc(db,"rollart","database"));
 if(snap.exists()) competitions=snap.data().competitions||[];
 renderCompetitions();
}
window.onload=load;

// ✅ Wettbewerb erstellen
window.addCompetition=()=>{
 competitions.push({
  id:Date.now(),
  name:compName.value,
  from:compFrom.value,
  to:compTo.value,
  runners:[]
 });

 save();
 renderCompetitions();
};

// anzeigen
function renderCompetitions(){
 compList.innerHTML=competitions.map(c=>`
  <div class="runner">
    <b>${c.name}</b><br>
    📅 ${c.from||"-"} - ${c.to||"-"}
    <button onclick="openComp(${c.id})">Öffnen</button>
  </div>
 `).join("");
}

// öffnen
window.openComp=(id)=>{
 active=competitions.find(c=>c.id===id);
 renderRunners();
};

// ✅ IMPORT
window.importText=()=>{
 let lines=importArea.value.split("\n");
 let cat="";
 let start=1;

 lines.forEach(l=>{
  l=l.trim();
  if(!l)return;

  if(l.match(/^\d{2}:\d{2}/)){
   cat=l.split(" ").slice(5).join(" ");
   return;
  }

  let m=l.match(/^(\d+)\s+(.+)$/);

  if(m){
   let parts=m[2].split(" ");
   let club=parts.slice(-2).join(" ");
   let name=parts.slice(0,-2).join(" ");

   active.runners.push({
    name,club,category:cat,start:start++,
    total:0,place:0,live:false
   });
  }
 });

 save();
 renderRunners();
};

// anzeigen
function renderRunners(){

 let cats={};

 active.runners.forEach(r=>{
  if(!cats[r.category]) cats[r.category]=[];
  cats[r.category].push(r);
 });

 runnerList.innerHTML=Object.keys(cats).map(cat=>`
  <div class="card">
    <b>${cat}</b>
    <div class="grid">
     ${cats[cat]
      .sort((a,b)=>a.place-b.place || a.start-b.start)
      .map(r=>`
       <div class="runner 
        ${r.live?"live":""}
        ${r.place==1?"place1":""}
        ${r.place==2?"place2":""}
        ${r.place==3?"place3":""}">
         ${r.place||r.start} ${r.name}<br>
         ${r.club||""}<br>
         ${r.total||0}
       </div>
     `).join("")}
    </div>
  </div>
 `).join("");
}

// START
window.start=()=>{
 active.runners.forEach(r=>r.live=false);
 active.runners.sort((a,b)=>a.start-b.start)[0].live=true;
 save(); renderRunners();
};

// NEXT
window.next=()=>{
 let list=[...active.runners].sort((a,b)=>a.start-b.start);
 let i=list.findIndex(r=>r.live);

 if(i>=0){
  list[i].live=false;
  if(list[i+1]) list[i+1].live=true;
 }

 save(); renderRunners();
};

// Abzug
function calc(input){
 let sum=0;
 input.split(",").forEach(n=>{
  let num=n.trim().toUpperCase().replace("A","").replace("B","");
  if(ded[num]) sum+=ded[num];
 });
 return sum;
}

// speichern
window.saveScore=()=>{

 let r=active.runners.find(x=>x.live);
 if(!r)return;

 let A=[A1.value,A2.value,A3.value].map(n=>+n||0);
 let B=[B1.value,B2.value,B3.value].map(n=>+n||0);

 r.aScore=A.reduce((a,b)=>a+b,0);
 r.bScore=B.reduce((a,b)=>a+b,0);

 r.deductionNumbers=dedInput.value;
 r.deduction=calc(dedInput.value);

 r.total=r.aScore+r.bScore-r.deduction;

 ranking();
 next();
};

// ranking
function ranking(){
 active.runners.sort((a,b)=>b.total-a.total);
 active.runners.forEach((r,i)=>r.place=i+1);
}
</script>
</head>

<body>

<div class="app">

<div class="card">
<h3>Wettbewerb erstellen</h3>
<input id="compName" placeholder="Name">
<input type="date" id="compFrom">
<input type="date" id="compTo">
<button onclick="addCompetition()">Speichern</button>
</div>

<div class="card">
<h3>Wettbewerbe</h3>
<div id="compList"></div>
</div>

<div class="card">
<h3>PDF / Text Import</h3>
<textarea id="importArea"></textarea>
<button onclick="importText()">Import</button>
</div>

<div class="card">
<h3>Läufer</h3>
<div id="runnerList"></div>
</div>

<div class="card">
<h3>Live</h3>

<button onclick="start()">Start</button>

A:
<input id="A1"><input id="A2"><input id="A3">

B:
<input id="B1"><input id="B2"><input id="B3">

Abzüge:
<input id="dedInput" placeholder="z.B. 5A,12,3">

<button onclick="saveScore()">Speichern</button>
<button onclick="next()">Weiter</button>

</div>

</div>

</body>
</html>
