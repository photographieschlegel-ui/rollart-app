<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>RollArt Admin</title>

<style>
body{background:#0f172a;color:white;font-family:Arial;margin:0;padding:10px;}
.card{background:#1e293b;padding:12px;border-radius:12px;margin-bottom:10px;}
input,button{width:100%;padding:10px;margin-top:5px;border-radius:8px;border:none;}
button{background:#2563eb;color:white;}
.runner{background:#334155;padding:8px;margin:5px;border-radius:8px;}
.live{background:#16a34a;}
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
 apiKey:"AIzaSyDtwZxklHFyqzEkhGbpBHKjcgLmPcD-oAU",
 authDomain:"rollart-score-5319a.firebaseapp.com",
 projectId:"rollart-score-5319a"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let competitions=[];
let active=null;

// ✅ komplette Abzüge
const deductions={
 "1":0.3,"2":0.5,"3":0.3,"4":0.2,"5":0.3,"6":0.3,"7":0.3,"8":0.3,
 "9":0.5,"10":0.5,"11":0.3,"12":0.3,"13":0.3,"14":0.3,"15":0.3,
 "16":0.5,"17":0.2,"18":0.5,"19":0.5,"20":0.5,"21":0.3,"22":0.5,"23":0.2
};

// speichern
async function save(){
 await setDoc(doc(db,"rollart","database"),{competitions});
 updateLive();
}

// live senden
async function updateLive(){
 if(!active)return;
 const runner=active.runners.find(r=>r.live);
 await setDoc(doc(db,"rollart","live"),{
  competition:active,
  runner:runner||null
 });
}

// laden
async function load(){
 const snap=await getDoc(doc(db,"rollart","database"));
 if(snap.exists()) competitions=snap.data().competitions||[];
 renderCompetitions();
}
window.onload=load;

// Wettbewerb erstellen
window.addCompetition=function(){
 competitions.push({
  id:Date.now(),
  name:compName.value,
  runners:[]
 });
 save();
 renderCompetitions();
};

// anzeigen
function renderCompetitions(){
 let html="";
 competitions.forEach(c=>{
  html+=`
  <div class="runner">
    ${c.name}
    <button onclick="openCompetition(${c.id})">Öffnen</button>
  </div>`;
 });
 compList.innerHTML=html;
}

// öffnen
window.openCompetition=function(id){
 active=competitions.find(c=>c.id===id);
 renderRunners();
};

// Läufer hinzufügen
window.addRunner=function(){
 active.runners.push({
  name:runnerName.value,
  a1:0,a2:0,a3:0,
  b1:0,b2:0,b3:0,
  total:0,
  deduction:0,
  place:0,
  live:false
 });
 save();
 renderRunners();
};

// Start
window.startCompetition=function(){
 active.runners.forEach(r=>r.live=false);
 if(active.runners.length>0) active.runners[0].live=true;
 save();
 renderRunners();
};

// nächster
window.nextRunner=function(){
 const i=active.runners.findIndex(r=>r.live);
 if(i>=0){
  active.runners[i].live=false;
  if(active.runners[i+1]){
   active.runners[i+1].live=true;
  }
 }
 save();
 renderRunners();
};

// Abzug berechnen
function calcDed(input){
 let sum=0;
 input.split(",").forEach(n=>{
  let num=n.trim().toUpperCase().replace("A","").replace("B","");
  if(deductions[num]) sum+=deductions[num];
 });
 return sum;
}

// speichern
window.saveScore=function(){
 const r=active.runners.find(x=>x.live);
 if(!r)return;

 r.a1=+A1.value||0;
 r.a2=+A2.value||0;
 r.a3=+A3.value||0;

 r.b1=+B1.value||0;
 r.b2=+B2.value||0;
 r.b3=+B3.value||0;

 r.aScore=r.a1+r.a2+r.a3;
 r.bScore=r.b1+r.b2+r.b3;

 r.deductionNumbers=ded.value;
 r.deduction=calcDed(ded.value);

 r.total=r.aScore+r.bScore-r.deduction;

 ranking();
 nextRunner();
};

// Ranking
function ranking(){
 active.runners.sort((a,b)=>b.total-a.total);
 active.runners.forEach((r,i)=>r.place=i+1);
}

// anzeigen
function renderRunners(){
 if(!active)return;

 let html="";
 active.runners.forEach(r=>{
  html+=`
  <div class="runner ${r.live?"live":""}">
    ${r.place||""} ${r.name} - ${r.total || 0}
  </div>`;
 });

 runnerList.innerHTML=html;
}
</script>
</head>

<body>

<div class="card">
<h3>Wettbewerb erstellen</h3>
<input id="compName" placeholder="Name">
<button onclick="addCompetition()">Speichern</button>
</div>

<div class="card">
<h3>Wettbewerbe</h3>
<div id="compList"></div>
</div>

<div class="card">
<h3>Läufer</h3>
<input id="runnerName" placeholder="Name">
<button onclick="addRunner()">Hinzufügen</button>
<div id="runnerList"></div>
</div>

<div class="card">
<h3>Live Wertung</h3>

<button onclick="startCompetition()">Start</button>

<br> A:
<input id="A1"><input id="A2"><input id="A3">

<br> B:
<input id="B1"><input id="B2"><input id="B3">

<br> Abzüge:
<input id="ded" placeholder="z.B. 5,12,3">

<button onclick="saveScore()">Speichern</button>
<button onclick="nextRunner()">Weiter</button>

</div>

</body>
</html>
