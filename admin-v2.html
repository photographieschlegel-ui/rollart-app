<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>🏆 RollArt Admin V2</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.js"></script>

<style>

body{
margin:0;
padding:0;
font-family:Arial,sans-serif;
background:#0f172a;
color:white;
}

.app{
max-width:1700px;
margin:auto;
padding:12px;
}

.card{
background:#1e293b;
padding:16px;
border-radius:18px;
margin-bottom:14px;
}

h1,h2{
margin-top:0;
}

input,
button,
select{
width:100%;
padding:12px;
margin-top:8px;
border:none;
border-radius:12px;
box-sizing:border-box;
}

input,
select{
background:#475569;
color:white;
}

button{
background:#2563eb;
color:white;
font-weight:bold;
cursor:pointer;
}

button:hover{
opacity:.9;
}

.grid{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(250px,1fr));
gap:12px;
}

.runnerGrid{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(180px,1fr));
gap:10px;
}

.runnerCard{
background:#334155;
padding:10px;
border-radius:12px;
}

.success{
background:#166534;
padding:10px;
border-radius:12px;
margin-top:10px;
}

</style>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
doc,
setDoc,
getDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

apiKey:"AIzaSyDtwZxklHFyqzEkhGbpBHKjcgLmPcD-oAU",
authDomain:"rollart-score-5319a.firebaseapp.com",
projectId:"rollart-score-5319a",
storageBucket:"rollart-score-5319a.firebasestorage.app",
messagingSenderId:"658963624980",
appId:"1:658963624980:web:2e4d153f5df087c4f42301"

};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.competitions = [];
window.archivedCompetitions = [];
window.activeCompetition = null;

window.NRW_CATEGORIES = [

"Kunstläufer 1",
"Kunstläufer 2",
"Kunstläufer 3",
"Kunstläufer 4",

"Nachwuchs 1",
"Nachwuchs 2",
"Nachwuchs 3",

"Cup",
"Cup A",

"Kür",
"Kurzkür"

];

window.saveDatabase = async function(){

await setDoc(
doc(db,"rollart","database_v2"),
{
competitions,
archivedCompetitions
}
);

};

window.loadDatabase = async function(){

const snap =
await getDoc(
doc(db,"rollart","database_v2")
);

if(snap.exists()){

competitions =
snap.data().competitions || [];

archivedCompetitions =
snap.data().archivedCompetitions || [];

}

renderCompetitions();

};

window.saveCompetition = async function(){

const competition = {

id:Date.now(),

name:
document.getElementById(
"competitionName"
).value,

place:
document.getElementById(
"competitionPlace"
).value,

from:
document.getElementById(
"competitionFrom"
).value,

to:
document.getElementById(
"competitionTo"
).value,

status:"active",

categories:[],
runners:[]

};

competitions.push(
competition
);

await saveDatabase();

renderCompetitions();

};

window.renderCompetitions =
function(){

const output =
document.getElementById(
"competitionList"
);

output.innerHTML = "";

competitions.forEach(comp=>{

output.innerHTML += `

<div class="runnerCard">

<b>${comp.name}</b>

<br><br>

📍 ${comp.place}

<br>

📅 ${comp.from}

<br>

<button onclick="openCompetition(${comp.id})">

📂 Öffnen

</button>

</div>

`;

});

};

window.openCompetition =
function(id){

activeCompetition =
competitions.find(
c=>c.id===id
);

document.getElementById(
"activeCompetition"
).innerHTML =

"🏆 " +
activeCompetition.name;

};

window.importPDF =
async function(){

if(!activeCompetition){

alert(
"Bitte Wettbewerb öffnen"
);

return;

}

const file =
document.getElementById(
"pdfFile"
).files[0];

if(!file){

alert(
"Bitte PDF auswählen"
);

return;

}

alert(
"PDF Import folgt in V2.1"
);

};

window.onload =
async function(){

await loadDatabase();

};

</script>

</head>

<body>

<div class="app">

<div class="card">

<h1>🏆 RollArt Admin V2</h1>

<div id="activeCompetition">

Kein Wettbewerb geöffnet

</div>

</div>

<div class="card">

<h2>🏆 Wettbewerb</h2>

<input
id="competitionName"
placeholder="Wettbewerb">

<input
id="competitionPlace"
placeholder="Ort">

<input
type="date"
id="competitionFrom">

<input
type="date"
id="competitionTo">

<button onclick="saveCompetition()">

💾 Wettbewerb speichern

</button>

</div>

<div class="card">

<h2>📋 Wettbewerbe</h2>

<div
id="competitionList"
class="grid">
</div>

</div>

<div class="card">

<h2>📥 NRW PDF Import</h2>

<input
type="file"
id="pdfFile"
accept=".pdf">

<button onclick="importPDF()">

📥 PDF importieren

</button>

</div>

</div>

</body>
</html>
