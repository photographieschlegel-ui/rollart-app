<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🏆 RollArt Admin</title>

<style>
body{
margin:0;
background:#0f172a;
color:white;
font-family:Arial;
}

.app{
max-width:1700px;
margin:auto;
padding:12px;
}

.card{
background:#1e293b;
padding:14px;
border-radius:18px;
margin-bottom:14px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:10px;
}

button,input,textarea{
width:100%;
padding:12px;
margin-top:8px;
border:none;
border-radius:12px;
}

button{
background:#2563eb;
color:white;
font-weight:bold;
cursor:pointer;
}

.deleteButton{background:#dc2626;}
.nextButton{background:#16a34a;}
</style>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const firebaseConfig = {
apiKey:"AIzaSyDtwZxklHFyqzEkhGbpBHKjcgLmPcD-oAU",
authDomain:"rollart-score-5319a.firebaseapp.com",
projectId:"rollart-score-5319a",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let competitions=[];
let activeCompetition=null;

async function saveDB(){
await setDoc(doc(db,"rollart","database"),{competitions});
}

async function loadDB(){
const snap=await getDoc(doc(db,"rollart","database"));
if(snap.exists())competitions=snap.data().competitions||[];
renderCompetitions();
}

window.saveCompetition=async ()=>{
competitions.push({
id:Date.now(),
name:competitionName.value,
place:competitionPlace.value,
runners:[],
categories:[]
});
await saveDB();
renderCompetitions();
};

window.deleteCompetition=async id=>{
if(!confirm("Wirklich löschen?"))return;
competitions=competitions.filter(c=>c.id!==id);
await saveDB();
renderCompetitions();
};

window.openCompetition=id=>{
activeCompetition=competitions.find(c=>c.id===id);
alert("Wettbewerb geöffnet");
};

window.importPDF=async ()=>{

if(!activeCompetition){
alert("Erst Wettbewerb öffnen!");
return;
}

const file=document.getElementById("pdfFile").files[0];
if(!file)return;

const reader=new FileReader();

reader.onload=async function(){

const pdf=await pdfjsLib.getDocument(
new Uint8Array(this.result)
).promise;

let start=1;

for(let p=1;p<=pdf.numPages;p++){

const page=await pdf.getPage(p);
const text=(await page.getTextContent())
.items.map(i=>i.str).join(" ");

const blocks=text.split(/\d{1,2}:\d{2}/);

blocks.forEach(b=>{

b=b.trim();
if(b.length<20)return;

let name=b.split("**")[0].trim();
if(name.length<5)return;

// Kategorie speichern
let cat=activeCompetition.categories.find(c=>c.name===name);

if(!cat){
cat={id:Date.now()+Math.random(),name};
activeCompetition.categories.push(cat);
}

// Dummy Läufer
for(let i=1;i<=5;i++){
activeCompetition.runners.push({
id:Date.now()+Math.random(),
name:"Läufer "+i,
club:"Verein",
category:name,
categoryId:cat.id,
start:start++
});
}

});

}

await saveDB();
alert("✅ Import fertig");

};

reader.readAsArrayBuffer(file);
};

function renderCompetitions(){
competitionList.innerHTML="";

competitions.forEach(c=>{
competitionList.innerHTML+=`
<div class="card">
<b>${c.name}</b><br>
${c.place}<br>

<button onclick="openCompetition(${c.id})">Öffnen</button>
<button class="deleteButton"
onclick="deleteCompetition(${c.id})">
🗑 Löschen
</button>

</div>`;
});
}

window.onload=loadDB;

</script>
</head>

<body>

<div class="app">

<div class="card">
<h2>🏆 Wettbewerb</h2>

<input id="competitionName" placeholder="Name">
<input id="competitionPlace" placeholder="Ort">

<button onclick="saveCompetition()">Speichern</button>
</div>

<div class="card">
<h2>📋 Wettbewerbe</h2>
<div id="competitionList" class="grid"></div>
</div>

<div class="card">
<h2>📥 PDF Import</h2>

<input type="file" id="pdfFile">

<button onclick="importPDF()">PDF importieren</button>

</div>

</div>

</body>
</html>
``
